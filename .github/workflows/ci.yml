name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docbrain
          POSTGRES_USER: docbrain
          POSTGRES_PASSWORD: docbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docbrain -d docbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://docbrain:docbrain@localhost:5432/docbrain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest
